<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Squad Room</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="setupView" class="setup-view">
        <div class="brand-row">
          <div class="brand-mark">SR</div>
          <div>
            <p class="eyebrow">Personal AI competition team</p>
            <h1>Squad Room</h1>
          </div>
        </div>

        <form id="meetingForm" class="setup-grid">
          <label>
            Topic
            <input name="topic" placeholder="AI education contest idea" required />
          </label>
          <label>
            Contest type
            <select name="contestType">
              <option>General</option>
              <option>Business Competition</option>
              <option>Computer Science Competition</option>
              <option>Design Competition</option>
              <option>Investment Competition</option>
              <option>Hackathon</option>
            </select>
          </label>
          <label>
            Goal
            <input name="goal" placeholder="Get from rough idea to pitch-ready plan" />
          </label>
          <label>
            Constraints
            <textarea name="constraints" placeholder="Deadline, team size, required deliverables, tools, budget..."></textarea>
          </label>
          <label>
            Project materials
            <textarea name="projectMaterials" placeholder="Paste contest rules, judging criteria, notes, source excerpts, or existing project context..."></textarea>
          </label>
          <div class="material-import">
            <input
              id="materialFileInput"
              type="file"
              accept=".txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.xml,.yaml,.yml,.pdf,.docx,.xls,.xlsx"
              multiple
              hidden
            />
            <button type="button" id="materialFileButton" class="ghost-button">Import Files</button>
            <span class="material-help">TXT, MD, CSV, JSON, HTML, PDF, DOCX, XLS/XLSX</span>
          </div>
          <div id="materialFileList" class="material-file-list"></div>
          <label>
            API endpoint
            <input name="apiBase" value="http://localhost:8787" />
          </label>
          <label class="toggle-row">
            <input name="autoWebResearch" type="checkbox" />
            <span class="toggle-control" aria-hidden="true"></span>
            <span>
              Automatic web research
              <small>Allow agents to send search queries without asking each time.</small>
            </span>
          </label>
          <div class="setup-actions">
            <button type="submit" class="primary-button">Open Room</button>
            <button type="button" id="loadDemoButton" class="ghost-button">Load Demo</button>
          </div>
        </form>
      </section>

      <section id="roomView" class="room-view hidden">
        <header class="topbar">
          <div>
            <p id="statusLine" class="eyebrow">Mock mode</p>
            <h2 id="roomTitle">Squad Room</h2>
          </div>
          <div class="topbar-actions">
            <label class="toggle-row compact">
              <input id="autoResearchToggle" type="checkbox" />
              <span class="toggle-control" aria-hidden="true"></span>
              <span>Auto research</span>
            </label>
            <span id="stageBadge" class="stage-badge">Framing</span>
            <button id="pauseButton" class="ghost-button pause-button" type="button">Pause</button>
            <button id="newMeetingButton" class="ghost-button">New</button>
          </div>
        </header>

        <aside class="squad-panel">
          <h3>Teammates</h3>
          <div id="squadList" class="squad-list"></div>
          <section class="capability-panel">
            <h3>Skills</h3>
            <div id="skillList" class="skill-list"></div>
          </section>
          <section class="capability-panel">
            <h3>Tools</h3>
            <div id="toolRegistry" class="tool-registry"></div>
          </section>
        </aside>

        <section class="chat-panel">
          <div id="messageList" class="message-list"></div>
          <form id="messageForm" class="composer">
            <input id="messageInput" placeholder="Interrupt, ask a teammate, or add constraints..." />
            <button type="submit" class="primary-button">Send</button>
          </form>
        </section>

        <aside class="output-panel">
          <div class="output-header">
            <h3>Brief</h3>
            <span id="usageLine">0 tokens</span>
          </div>
          <div id="outputs" class="outputs"></div>
          <section class="activity-panel">
            <div class="activity-header">
              <h3>Tool Activity</h3>
              <span id="activityCount">0</span>
            </div>
            <div id="activityList" class="activity-list"></div>
          </section>
          <div class="output-actions">
            <button id="runMeetingButton" class="primary-button">Run Meeting</button>
            <button id="continueButton" class="ghost-button">Next Stage</button>
            <button id="summaryButton" class="ghost-button">Summary</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="./app.js?v=20260602-9" type="module"></script>
  </body>
</html>
